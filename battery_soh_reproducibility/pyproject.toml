[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-soh-repro"
version = "1.0.0"
description = "Reproducibility code for battery-level and cross-dataset lithium-ion SoH estimation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "openpyxl>=3.1,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
